[package]
name = "gamegauge-saves"
version = "0.1.24"
edition = "2024"
rust-version = "1.97.1"
description = "GameGauge 存档备份工作进程"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
winreg = "0.56"
zip = { version = "6", default-features = false, features = ["deflate"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation", "Win32_Security_Credentials",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_Threading"
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
